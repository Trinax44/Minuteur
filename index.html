<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0c11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Minuteur">
  <title>Minuteur</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="view"></main>

  <nav id="tabbar">
    <button data-tab="timer" class="tab active">
      <svg viewBox="0 0 24 24"><path d="M9 1h6v2H9zM19.03 7.39l1.42-1.42-1.41-1.41-1.42 1.42A9 9 0 1 0 19.03 7.39zM12 21a7 7 0 1 1 0-14 7 7 0 0 1 0 14zm-1-12h2v6h-2z"/></svg>
      <span>Minuteur</span>
    </button>
    <button data-tab="workouts" class="tab">
      <svg viewBox="0 0 24 24"><path d="M2 10h2V8a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v3h8V8a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2h2v4h-2v2a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-3H8v3a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2H2z"/></svg>
      <span>Séances</span>
    </button>
    <button data-tab="history" class="tab">
      <svg viewBox="0 0 24 24"><path d="M4 20V10h3v10H4zm6.5 0V4h3v16h-3zM17 20v-7h3v7h-3z"/></svg>
      <span>Suivi</span>
    </button>
    <button data-tab="settings" class="tab">
      <svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
      <span>Réglages</span>
    </button>
  </nav>

  <!-- Écran de la séance en cours -->
  <section id="run" hidden>
    <header class="run-top">
      <button class="run-btn" id="run-close" aria-label="Quitter">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>
      </button>
      <div class="run-total"><small>RESTANT</small><b id="run-total">00:00</b></div>
      <button class="run-btn" id="run-voice" aria-label="Annonces vocales">
        <svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zM15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M3 9h4l5-4v14l-5-4H3z"/></svg>
      </button>
    </header>
    <div class="run-stage">
      <div class="run-ex">
        <div class="run-ex-anim" id="run-anim"></div>
        <div class="run-ex-name" id="run-name"></div>
      </div>
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="54"/><circle class="fg" id="run-ring" cx="60" cy="60" r="54"/></svg>
        <div class="ring-inner" id="run-inner">
          <div class="phase-pill" id="run-phase">Effort</div>
          <div class="run-time" id="run-time">00:00</div>
          <div class="run-set" id="run-set"></div>
        </div>
      </div>
    </div>
    <div class="run-next" id="run-next"></div>
    <footer class="run-controls">
      <button class="run-side" id="run-prev" aria-label="Précédent">
        <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
      </button>
      <button class="run-main" id="run-toggle" aria-label="Pause"></button>
      <button class="run-side" id="run-skip" aria-label="Suivant">
        <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
      </button>
    </footer>
  </section>

  <div id="sheet-root"></div>

  <script src="exercises.js"></script>
  <script src="app.js"></script>
</body>
</html>
